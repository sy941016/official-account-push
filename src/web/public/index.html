<title>公众号内容助手 · AI Agent</title>
<style>
  :root {

    --border-strong: #d3d7de;

    --text-2: #5b6472;
    --text-3: #98a1b0;
    --brand: #07c160;
    --brand-strong: #059a4c;
    --brand-soft: #e9f8f0;
    --brand-ink: #056b38;
    --danger: #d92d20;
    --danger-soft: #fef3f2;
    --warn: #b54708;
    --warn-soft: #fffaeb;
    --info: #175cd3;
    --info-soft: #eff8ff;
    --shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-sm: 0 1px 3px rgba(16, 24, 40, .07), 0 1px 2px rgba(16, 24, 40, .04);
    --shadow-md: 0 6px 16px rgba(16, 24, 40, .07), 0 2px 5px rgba(16, 24, 40, .04);
    --shadow-lg: 0 20px 44px rgba(16, 24, 40, .12);

            "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;

  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f13;
      --surface: #161920;
      --surface-2: #1d2129;
      --border: #262b34;
      --border-strong: #363d49;
      --text: #e9ebef;
      --text-2: #9aa3b2;
      --text-3: #6b7482;
      --brand: #2ecc71;
      --brand-strong: #22b45f;
      --brand-soft: #10261b;
      --brand-ink: #7ee2ab;
      --danger: #f97066;
      --danger-soft: #2a1616;
      --warn: #fdb022;

      --info: #84caff;

      --shadow-lg: 0 24px 52px rgba(0, 0, 0, .6);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .brand-mark {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(145deg, var(--brand), var(--brand-strong));
    display: grid;
    place-items: center;
    color: #fff;
    box-shadow: var(--shadow-sm);
  }

  .brand-text { min-width: 0; }
  .brand-text h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-text p {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-actions { display: flex; align-items: center; gap: 10px; flex: none; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
    white-space: nowrap;
  }
  .status-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-3);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-3) 18%, transparent);
  }
  .status-pill.is-ok .dot { background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
  .status-pill.is-bad .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }

  .btn {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s, color .16s, border-color .16s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-3); }
  .btn:active { transform: translateY(.5px); }

  .user-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px 0 5px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-2);
    white-space: nowrap;
  }
  .user-chip .avatar {
    flex: none;
    width: 23px;
    height: 23px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--brand), var(--brand-strong));
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .user-chip[hidden] { display: none; }

  /* ============ 对话区 ============ */
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    position: relative;
  }
  .chat-scroll::-webkit-scrollbar { width: 10px; }
  .chat-scroll::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text-3) 35%, transparent);
    border: 3px solid transparent;
    background-clip: padding-box;
    border-radius: 999px;
  }
  .chat-scroll::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 55%, transparent); background-clip: padding-box; }

  .chat {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 28px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .row { display: flex; gap: 12px; align-items: flex-start; animation: rise .34s cubic-bezier(.22,.7,.3,1) both; }
  .row.user { flex-direction: row-reverse; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .avatar {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-top: 2px;
  }
  .row.agent .avatar { background: var(--brand-soft); color: var(--brand-ink); border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent); }
  .row.user .avatar { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

  .bubble {
    min-width: 0;
    max-width: 100%;
    border-radius: var(--r-lg);
    padding: 13px 17px;
    font-size: 14px;
    line-height: 1.72;
    overflow-wrap: anywhere;
  }

  .row.agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    border-top-left-radius: 5px;
    color: var(--text);
  }
  .row.user .bubble {
    background: var(--brand);
    color: #fff;
    border-top-right-radius: 5px;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--brand-strong) 30%, transparent);
    white-space: pre-wrap;
  }
  @media (prefers-color-scheme: dark) {
    .row.user .bubble { color: #06170e; }
  }

  /* 正文排版 */
  .bubble p { margin: 0 0 10px; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble h3 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; letter-spacing: -.01em; }
  .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--brand-ink); text-underline-offset: 2px; }
  .bubble blockquote {
    margin: 0 0 10px;
    padding: 8px 14px;
    border-left: 3px solid color-mix(in srgb, var(--brand) 55%, transparent);
    background: var(--surface-2);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    color: var(--text-2);
    font-size: 13.5px;
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .bubble code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .bubble pre {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .bubble pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }

  /* 欢迎卡片 */
  .bubble--welcome { padding: 20px 22px; }
  .bubble--welcome h2 { font-size: 16px; font-weight: 600; letter-spacing: -.015em; margin-bottom: 6px; }
  .bubble--welcome .lead { color: var(--text-2); margin-bottom: 18px; }
  .caps { display: grid; gap: 10px; }
  .cap {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    padding: 11px 13px;
    border-radius: var(--r-md);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .cap-ico {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--brand-ink);
  }
  .cap b { display: block; font-size: 13px; font-weight: 600; }
  .cap span { font-size: 12.5px; color: var(--text-2); }
  .bubble--welcome .tip {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px;
    color: var(--text-3);
  }

  /* 执行过程 */
  .steps {
    /* 左边留出头像列的宽度，让左边缘和气泡对齐 —— 它属于 agent 这一轮，不是全局系统消息 */
    margin-left: 42px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    animation: rise .34s cubic-bezier(.22,.7,.3,1) both;
  }
  .steps-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
  }
  .steps-head svg { color: var(--brand-ink); }

  .steps-body { padding: 6px 0; }
  .step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 7px 14px;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .step + .step { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  .step-ico {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    margin-top: 1px;
  }
  .step.thought .step-ico { background: var(--info-soft); color: var(--info); }
  .step.tool_call .step-ico { background: var(--warn-soft); color: var(--warn); }
  .step.tool_result .step-ico { background: var(--brand-soft); color: var(--brand-ink); }
  .step-tag {
    font-weight: 600;
    color: var(--text);
  }
  .step-text { min-width: 0; overflow-wrap: anywhere; }
  .step-text .mono { font-family: var(--mono); font-size: 12px; color: var(--text-3); }

  /* 系统提示 */
  .notice {
    align-self: center;
    max-width: 92%;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--danger-soft);
    border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
    color: var(--danger);
    font-size: 12.5px;
    animation: rise .3s ease both;
  }

  /* 加载态 */
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 2px; }
  .typing i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand);
    animation: blink 1.3s infinite ease-in-out both;
  }
  .typing i:nth-child(2) { animation-delay: .16s; }
  .typing i:nth-child(3) { animation-delay: .32s; }
  @keyframes blink {
    0%, 70%, 100% { opacity: .25; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-3px); }
  }

  /* 消息操作 */
  .msg-tools {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity .18s;
  }
  .row.agent .bubble-wrap:hover .msg-tools { opacity: 1; }
  .bubble-wrap { min-width: 0; max-width: 82%; }
  .tool-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 9px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-3);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .tool-btn:hover { color: var(--text); border-color: var(--border-strong); }

  /* 回到底部 */
  .to-bottom {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 10px);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    box-shadow: var(--shadow-md);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 5;
  }
  .to-bottom.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

  /* ============ 输入区 ============ */
  .composer-wrap {
    flex: none;
    padding: 8px 0 22px;
  }
  /* 内边距要和 .chat 一致，否则输入框的左右边缘会跟正文内容错开 */
  .composer { max-width: 820px; margin: 0 auto; padding: 0 28px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: transform .16s, border-color .16s, color .16s;
  }
  .chip:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); color: var(--brand-ink); }
  .chip svg { opacity: .75; }
  .chip:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .composer-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 8px 8px 8px 16px;
    border-radius: var(--r-xl);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    transition: border-color .18s, box-shadow .18s;
  }
  .composer-box:focus-within {
    border-color: color-mix(in srgb, var(--brand) 55%, var(--border));
    box-shadow: var(--shadow-md), 0 0 0 4px color-mix(in srgb, var(--brand) 12%, transparent);
  }

  #messageInput {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    max-height: 148px;
    min-height: 26px;
    padding: 8px 0;
  }
  #messageInput::placeholder { color: var(--text-3); }

  .btn-send {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 38px;
    padding: 0 16px;
    border: none;
    border-radius: 14px;
    background: var(--brand);
    color: #fff;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .16s, transform .12s, opacity .16s;
  }
  @media (prefers-color-scheme: dark) { .btn-send { color: #06170e; } }
  .btn-send:hover { background: var(--brand-strong); }
  .btn-send:active { transform: scale(.975); }
  .btn-send:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .composer-hint {
    margin-top: 9px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .composer-hint kbd {
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  @media (max-width: 640px) {
    .topbar { padding: 12px 16px; }
    .brand-text p { display: none; }
    .chat { padding: 22px 16px 30px; gap: 18px; }
    .composer-wrap { padding: 8px 0 16px; }
    .composer { padding: 0 16px; }
    .bubble-wrap { max-width: 88%; }
    .status-pill { display: none; }
    /* 窄屏只留头像，省出横向空间给"清空会话 / 退出登录" */
    .user-chip { padding-right: 5px; }
    .user-chip #userName { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .chat-scroll { scroll-behavior: auto; }
  }
</style>

<script>
  const chatScroll = document.getElementById('chatScroll');
  const chatContainer = document.getElementById('chatContainer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toBottom = document.getElementById('toBottom');

  // 会话 ID 每次刷新都换一个，避免和上一次的上下文串台
  const sessionId = 'web_' + Math.random().toString(36).slice(2, 10);

  // 访问令牌：服务端配了 WEB_ACCESS_TOKEN 时，页面需要用 ?token=xxx 打开
  // （或者之前存过），否则 /api/* 一律 401
  const accessToken = new URLSearchParams(location.search).get('token')
    || localStorage.getItem('webAccessToken') || '';
  if (accessToken) localStorage.setItem('webAccessToken', accessToken);

  const TOOL_NAMES = {
    crawl_weibo: '爬取微博热搜',
    crawl_douyin: '爬取抖音热点',
    generate_article: '生成文章',
    publish_to_wechat: '推送到公众号',
    send_feishu_notification: '发送飞书通知',
    get_system_status: '查询系统状态',
    search_cached_topics: '搜索缓存热点',
  };

  const ICON = {
    thought: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.3.3.5.7.5 1.1h6c0-.4.2-.8.5-1.1A6 6 0 0 0 12 3Z"/></svg>',
    tool_call: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 21l-3 0-9.7-9.7a4 4 0 0 1-5-5l2.4 2.4 2.3-2.3L5.6 4a4 4 0 0 1 5 5Z"/></svg>',
    tool_result: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
    agent: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.2-.6L3 21l1.8-5a8.1 8.1 0 0 1-.8-3.5 8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8 8.4Z"/></svg>',
  };

  let isLoading = false;

  /* ============ 基础工具 ============ */

  function escapeHtml(text) {
    const el = document.createElement('span');
    el.textContent = String(text ?? '');
    return el.innerHTML;
  }

  /** 贴底时才自动滚动，避免用户往回翻历史时被拽走 */
  function isNearBottom() {
    return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 90;
  }

  function scrollToBottom(force) {
    if (force || isNearBottom()) {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }
  }

  chatScroll.addEventListener('scroll', () => {
    const atBottom = chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 90;
    toBottom.classList.toggle('show', !atBottom);
  });

  /**
   * 极简 Markdown 渲染。
   * 先转义再套标签，顺序不能反 —— 反了就等于给了模型一个 XSS 入口。
   */
  function renderMarkdown(src) {
    const lines = escapeHtml(src).split('\n');
    const out = [];
    let listType = null;
    let inCode = false;
    let codeBuf = [];

    const closeList = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    for (const raw of lines) {
      const line = raw.replace(/\s+$/, '');

      if (/^\s*```/.test(line)) {
        if (inCode) { out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>'); codeBuf = []; inCode = false; }
        else { closeList(); inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(raw); continue; }

      const heading = line.match(/^#{1,4}\s+(.*)$/);
      if (heading) { closeList(); out.push('<h3>' + inline(heading[1]) + '</h3>'); continue; }

      if (/^\s*([-*_])\s*\1\s*\1[\s\S]*$/.test(line)) { closeList(); out.push('<hr>'); continue; }

      // 注意：这一步的输入已经过 escapeHtml，行首的 ">" 此时是 "&gt;"
      const quote = line.match(/^\s*&gt;\s?(.*)$/);
      if (quote) { closeList(); out.push('<blockquote>' + inline(quote[1]) + '</blockquote>'); continue; }

      const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
      if (bullet) {
        if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
        out.push('<li>' + inline(bullet[1]) + '</li>');
        continue;
      }

      const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ordered) {
        if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
        out.push('<li>' + inline(ordered[1]) + '</li>');
        continue;
      }

      if (!line.trim()) { closeList(); continue; }

      closeList();
      out.push('<p>' + inline(line) + '</p>');
    }

    if (inCode) out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
    closeList();
    return out.join('');
  }

  /* ============ 消息渲染 ============ */

  function makeRow(role) {
    const row = document.createElement('div');
    row.className = 'row ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.setAttribute('aria-hidden', 'true');
    if (role === 'agent') avatar.innerHTML = ICON.agent;
    else avatar.textContent = '我';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    row.append(avatar, wrap);
    return { row, wrap };
  }

  function addMessage(content, role) {
    if (role === 'system') return addNotice(content);

    const { row, wrap } = makeRow(role);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'agent') {
      bubble.innerHTML = renderMarkdown(content);
      wrap.appendChild(bubble);

      const tools = document.createElement('div');
      tools.className = 'msg-tools';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'tool-btn';
      copyBtn.textContent = '复制';
      copyBtn.onclick = () => {
        navigator.clipboard?.writeText(content).then(
          () => { copyBtn.textContent = '已复制'; setTimeout(() => (copyBtn.textContent = '复制'), 1500); },
          () => { copyBtn.textContent = '复制失败'; setTimeout(() => (copyBtn.textContent = '复制'), 1500); }
        );
      };
      tools.appendChild(copyBtn);
      wrap.appendChild(tools);
    } else {
      bubble.textContent = content;
      wrap.appendChild(bubble);
    }

    chatContainer.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addNotice(text) {
    const div = document.createElement('div');
    div.className = 'notice';
    div.innerHTML = '<span>' + escapeHtml(text) + '</span>';
    chatContainer.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addStepsCard(steps) {
    if (!steps || !steps.length) return;

    const card = document.createElement('div');
    card.className = 'steps';

    const head = document.createElement('div');
    head.className = 'steps-head';
    head.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg><span>执行过程 · ' + steps.length + ' 步</span>';
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'steps-body';

    for (const step of steps) {
      const el = document.createElement('div');
      el.className = 'step ' + (step.type || 'thought');

      const ico = document.createElement('span');
      ico.className = 'step-ico';
      ico.innerHTML = ICON[step.type] || ICON.thought;

      const text = document.createElement('span');
      text.className = 'step-text';

      if (step.type === 'tool_call') {
        const name = TOOL_NAMES[step.name] || step.name || '未知工具';
        text.innerHTML = '<span class="step-tag">调用</span> ' + escapeHtml(name) +
          ' <span class="mono">' + escapeHtml(step.name || '') + '</span>';
      } else if (step.type === 'tool_result') {
        const name = TOOL_NAMES[step.name] || step.name || '未知工具';
        const result = String(step.result ?? '');
        const preview = result.length > 140 ? result.slice(0, 140) + '…' : result;
        text.innerHTML = '<span class="step-tag">' + escapeHtml(name) + '</span> ' + escapeHtml(preview);
      } else {
        const content = String(step.content ?? '');
        text.innerHTML = escapeHtml(content.length > 220 ? content.slice(0, 220) + '…' : content);
      }

      el.append(ico, text);
      body.appendChild(el);
    }

    card.appendChild(body);
    chatContainer.appendChild(card);
    scrollToBottom();
    return card;
  }

  function showLoading() {
    const { row, wrap } = makeRow('agent');
    row.id = 'loadingIndicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    wrap.appendChild(bubble);
    chatContainer.appendChild(row);
    scrollToBottom();
  }

  function hideLoading() {
    document.getElementById('loadingIndicator')?.remove();
  }

  /* ============ 欢迎页 ============ */

  const CAPABILITIES = [
    { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5M9 19v-7M14 19V9M19 19v-4"/></svg>', title: '热点采集', desc: '爬取微博热搜与抖音热点，自动排序去重' },
    { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>', title: '文章生成', desc: '爆款风格 / 周杰伦情感风格，自带反 AI 检测优化' },
    { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>', title: '一键发布', desc: '推送至公众号草稿箱，并同步飞书通知' },
  ];

  function renderWelcome() {
    const { row, wrap } = makeRow('agent');
    row.id = 'welcomeRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bubble--welcome';
    bubble.innerHTML =
      '<h2>你好，我是你的公众号内容运营助手</h2>' +
      '<p class="lead">把想做的事直接告诉我。我会自己拆解步骤、调用工具，完成后给你结论。</p>' +
      '<div class="caps">' +
      CAPABILITIES.map((c) =>
        '<div class="cap"><span class="cap-ico">' + c.icon + '</span>' +
        '<div><b>' + c.title + '</b><span>' + c.desc + '</span></div></div>'
      ).join('') +
      '</div>' +
      '<p class="tip">提示：涉及发布的动作会真实推送到公众号草稿箱。想先看效果，可以说「只生成不发布」。</p>';
    wrap.appendChild(bubble);
    chatContainer.appendChild(row);
  }

  /* ============ 交互 ============ */

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 148) + 'px';
  }

  function handleKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function setBusy(busy) {
    isLoading = busy;
    sendBtn.disabled = busy;
    document.querySelectorAll('.chip').forEach((c) => (c.disabled = busy));
  }

  /* ============ 登录态 ============ */

  /** 会话没了就回登录页。用 replace 是为了不在历史里留下一条"已经失效的页面" */
  function gotoLogin() {
    location.replace('/login');
  }

  /** 顶栏显示当前账号。服务端没启用登录时接口返回空用户名，顶栏保持原样 */
  async function loadMe() {
    try {
      const res = await fetch('/api/me');
      if (res.status === 401) return gotoLogin();
      if (!res.ok) return;

      const data = await res.json();
      if (!data.username) return;

      document.getElementById('userName').textContent = data.username;
      document.getElementById('userAvatar').textContent = data.username.slice(0, 1);
      document.getElementById('userChip').hidden = false;
      document.getElementById('logoutBtn').hidden = false;
    } catch {
      // 取不到就当作没启用登录，不影响聊天
    }
  }

  async function logout() {
    try {
      await fetch('/api/logout', { method: 'POST' });
    } catch {
      // 请求失败也照样回登录页；cookie 没清掉最多是多点一次
    }
    gotoLogin();
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || isLoading) return;

    setBusy(true);
    messageInput.value = '';
    messageInput.style.height = 'auto';

    addMessage(text, 'user');
    showLoading();

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (accessToken) headers['x-web-token'] = accessToken;

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers,
        body: JSON.stringify({ message: text, sessionId }),
      });

      hideLoading();

      if (!res.ok) {
        let data = null;
        try { data = await res.json(); } catch {}
        // 会话过期：服务端会在响应体里带 loginRequired，直接送回登录页
        if (data?.loginRequired) return gotoLogin();
        if (res.status === 401) {
          addNotice('访问被拒绝：服务端启用了 WEB_ACCESS_TOKEN，请用 /?token=你的令牌 打开本页');
          return;
        }
        addNotice('出错了：' + (data?.error || '请求失败'));
        return;
      }

      const data = await res.json();
      if (data.thinkingSteps?.length) addStepsCard(data.thinkingSteps);
      if (data.reply) addMessage(data.reply, 'agent');
    } catch (err) {
      hideLoading();
      addNotice('网络错误：' + err.message);
    } finally {
      setBusy(false);
      messageInput.focus();
    }
  }

  function quickSend(text) {
    if (isLoading) return;
    messageInput.value = text;
    autoResize(messageInput);
    sendMessage();
  }

  async function resetChat() {
    if (isLoading) return;
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (accessToken) headers['x-web-token'] = accessToken;

      const res = await fetch('/api/reset', {
        method: 'POST',
        headers,
        body: JSON.stringify({ sessionId }),
      });
      if (res.status === 401) return gotoLogin();
      if (!res.ok) throw new Error('HTTP ' + res.status);

      chatContainer.innerHTML = '';
      renderWelcome();
      scrollToBottom(true);
      messageInput.focus();
    } catch (err) {
      addNotice('清空失败：' + err.message);
    }
  }

  /** 探活，把顶栏那个状态点变成真的有用 */
  async function pingHealth() {
    const pill = document.getElementById('connStatus');
    const label = document.getElementById('connText');
    try {
      const res = await fetch('/health');
      const data = await res.json();
      const ok = res.ok && data.status === 'ok';
      pill.classList.toggle('is-ok', ok);
      pill.classList.toggle('is-bad', !ok);
      label.textContent = ok ? (data.agentReady ? '服务就绪' : 'Agent 未初始化') : '服务异常';
    } catch {
      pill.classList.add('is-bad');
      label.textContent = '后端未连接';
    }
  }

  renderWelcome();
  pingHealth();
  loadMe();
  setInterval(pingHealth, 60000);
  messageInput.focus();
</script>
